version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - node -v
            - cd ../.. && npm ci --no-audit --no-fund && cd apps/web
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
      customHeaders:
        - pattern: "/assets/*"
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
        - pattern: "/fonts/*"
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
        - pattern: "**"
          headers:
            - key: X-Content-Type-Options
              value: nosniff
            - key: Referrer-Policy
              value: strict-origin-when-cross-origin
            - key: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
