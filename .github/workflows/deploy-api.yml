name: Deploy da API

# Roda quando algo da API (ou do pacote compartilhado) entra na main.
# Sem chave de acesso AWS no GitHub: o job assume uma role via OIDC (infra/bootstrap/github-oidc.yaml).
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrar banco e publicar Lambda
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w apps/api

      - name: Migrations (Supabase, pooler porta 5432)
        run: npm run db:migrate -w apps/api
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}

      - name: Bundle da Lambda
        run: npm run build -w apps/api
        env:
          APP_VERSION: ${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam deploy
        working-directory: apps/api
        run: |
          sam deploy \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              DatabaseUrl="${{ secrets.DATABASE_URL }}" \
              JwtSecret="${{ secrets.JWT_SECRET }}" \
              AllowedOrigins="${{ vars.ALLOWED_ORIGINS }}" \
              CookieDomain="${{ vars.COOKIE_DOMAIN }}" \
              ApiDomainName="${{ vars.API_DOMAIN_NAME }}" \
              CertificateArn="${{ secrets.ACM_CERT_ARN }}" \
              AppVersion="${{ github.sha }}"

      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name hub-hungara-api --region sa-east-1 \
                --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API: $URL"
          curl --fail --silent --show-error "$URL/health"
